# Single export-seller search (legacy dual-URL + amazon_com scrape: see _archive_amazon_com_search/).
search_urls:
  amazon_export: "https://www.amazon.com/s?k=pokemon+tcg&me=A2XZ7JICGUQ1CX"

required_keywords:
  - "pokemon"
  - "tcg"
required_any_keywords:
  - "booster"
  - "booster box"
  - "bundle"
  - "elite trainer box"
  - "etb"
  - "collection"
  - "tin"
  - "blister"
  - "packs"
  - "pack"

search_poll_minutes: 4
search_pages: 5
max_requests_per_minute: 10
price_drop_percent: 10
enable_missing_asin_oos: true
min_results_for_absence_reconcile: 1

affiliate_tag: "yourclient-20"
wa_api_url: "http://localhost:3001/send"
wa_api_key: "change_this_to_a_long_random_secret"
wa_group_id: "120363408155154756@g.us"
wa_client_to: ""
wa_restart_command: ""
wa_send_heartbeat: false
wa_send_modem_trigger: false
wa_message_templates:
  default: |
    New product detected!
    Title: {title}
    Price: {price_text}
    Link: {affiliate_link}
  new_product: |
    New product detected!
    Title: {title}
    Price: {price_text}
    Link: {affiliate_link}
  price_drop: |
    Price drop detected!
    Title: {title}
    Price: {price_text}
    Link: {affiliate_link}
  back_in_stock: |
    Back in stock!
    Title: {title}
    Price: {price_text}
    Link: {affiliate_link}
  setup_test: |
    Setup test alert
    Title: {title}
    Price: {price_text}
    Link: {affiliate_link}
  heartbeat_ok: |
    Heartbeat OK: {timestamp}
  heartbeat_error: |
    Heartbeat failed: {error_message}
    Time: {timestamp}
  search_error: |
    Search loop error: {error_message}
    Time: {timestamp}
  modem_error: |
    Modem job error: {error_message}
    Time: {timestamp}
  modem_trigger: |
    Modem recovery trigger fired.
    Time: {timestamp}

modem_auto_refresh_hours: 2
modem_reconnect_command: "echo reconnect-modem-command"

telegram_bot_token: ""
telegram_chat_id: ""

db_path: "data/monitor.db"
log_dir: "logs"
auth_dir: "auth"
last_ip_path: "data/last_ip.txt"
