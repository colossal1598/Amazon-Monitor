<!doctype html>
<html lang="en">
<head><title>Amazon.com: Skeleton Offers Product</title></head>
<body>
  <div id="dp-container">
    <div id="titleSection">
      <h1 id="title"><span id="productTitle">Skeleton Offers Product (Collector Edition)</span></h1>
    </div>

    <!-- Degraded soft-block skeleton: core price block rendered but EMPTY. The inner
         apex_with_rio_cx wrapper carries no price nodes (no .a-price, no .a-offscreen). -->
    <div id="corePrice_feature_div" class="celwidget" data-feature-name="corePrice">
      <div class="a-section a-spacing-none apex_with_rio_cx"></div>
    </div>
    <div id="corePriceDisplay_desktop_feature_div" class="celwidget"></div>

    <!-- Every offer widget is flagged not-in-initial-active-row; there is NO
         data-csa-c-is-in-initial-active-row="true" element anywhere on the page. -->
    <div id="desktop_buybox" class="rio-buybox">
      <div id="buybox" data-csa-c-type="widget" data-csa-c-is-in-initial-active-row="false">
        <div id="qualifiedBuybox" data-csa-c-is-in-initial-active-row="false">
          <div id="buybox-see-all-buying-choices-block" data-csa-c-is-in-initial-active-row="false"></div>
        </div>
        <div id="unqualifiedBuyBox" data-csa-c-is-in-initial-active-row="false"></div>
      </div>
    </div>

    <div id="rightCol">
      <div id="offerDisplay_feature_div" data-csa-c-is-in-initial-active-row="false"></div>
      <div id="buyNow_feature_div" class="celwidget">
        <span class="a-button">
          <input id="buy-now-button" name="submit.buy-now" title="Buy Now" type="submit" />
        </span>
      </div>
      <div id="merchantInfoFeature_feature_div" data-csa-c-is-in-initial-active-row="false"></div>
    </div>

    <div id="imageBlock_feature_div">
      <img id="landingImage" src="https://m.media-amazon.com/images/I/placeholder.jpg" alt="Skeleton Offers Product" />
    </div>
  </div>
</body>
</html>
